org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# AndroidX: required because the project depends on androidx.* artifacts
# (core-ktx, appcompat, material, recyclerview, room, etc.) — without this,
# AGP's checkDebugAarMetadata task fails the build.
android.useAndroidX=true
android.nonTransitiveRClass=true
